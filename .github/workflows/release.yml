name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python Dependencies & Compile Backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --name studio_pro_backend --onefile --hidden-import uvicorn --hidden-import fastapi --hidden-import sounddevice --hidden-import librosa app/main.py
        
      - name: Prepare Backend Binary
        run: |
          mkdir -p backend-dist
          # On Windows, PyInstaller adds .exe
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp backend/dist/studio_pro_backend.exe backend-dist/
          else
            cp backend/dist/studio_pro_backend backend-dist/
            chmod +x backend-dist/studio_pro_backend
          fi
        shell: bash

      - name: Install Node Dependencies
        run: npm install

      - name: Build and Package Electron App
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run pack:win
          else
            npm run pack:mac
          fi
        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-electron/*.dmg
            dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
